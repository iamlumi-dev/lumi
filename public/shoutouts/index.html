<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shoutouts ✧ lumis work</title>
  <meta name="description" content="things other people made that lumi cannot stop playing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="portfolio">
  <div id="p5-bg-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <header class="portfolio-head">
    <h1>shoutouts</h1>
    <nav class="portfolio-nav">
      <a href="/"><button>home</button></a>
      <a href="/portfolio/"><button>work</button></a>
      <a href="/about/"><button>about me</button></a>
      <a href="/friends/"><button>friends</button></a>
      <a href="/colophon/"><button>colophon</button></a>
    </nav>
  </header>

  <!-- einleitungszeile und einträge kommen beide aus der datenbank -->
  <section id="controls" aria-label="filter">
    <p id="intro" class="dim-line"></p>
    <div class="control-row" id="filterRow" hidden>
      <span class="control-label">filter by</span>
      <button class="chip" data-filter="all" aria-pressed="true">all</button>
    </div>
    <div class="control-row">
      <span class="control-label"></span>
      <span id="status" role="status" aria-live="polite">loading …</span>
    </div>
  </section>

  <main>
    <ul id="shouts" class="shouts"></ul>
    <p id="empty" hidden>nothing here yet …</p>
  </main>

  <footer><p>&copy; made by lumi 2026</p></footer>

  <script src="/js/site.js" defer></script>
  <script src="/js/shoutouts.js" defer></script>
</body>
</html>
