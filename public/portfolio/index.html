<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>work ✧ lumis work</title>
  <meta name="description" content="alles, was lumi gebaut hat — filterbar nach kategorie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="portfolio">
  <div id="p5-bg-container"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <header class="portfolio-head">
    <h1>lumis work</h1>
    <nav class="portfolio-nav" data-nav>
    </nav>
  </header>

  <!-- filter- und sortierleiste. wird aus /api/categories befuellt. -->
  <section id="controls" aria-label="filter und sortierung">
    <div class="control-row" id="filterRow">
      <span class="control-label">filter by</span>
      <button class="chip" data-filter="all" aria-pressed="true">all</button>
    </div>

    <div class="control-row" id="sortRow">
      <span class="control-label">sort by</span>
      <button class="chip" data-sort="arranged" aria-pressed="true">as arranged</button>
      <button class="chip" data-sort="newest" aria-pressed="false">newest</button>
      <button class="chip" data-sort="oldest" aria-pressed="false">oldest</button>
      <button class="chip" data-sort="title"  aria-pressed="false">a–z</button>
    </div>

    <div class="control-row">
      <span class="control-label"></span>
      <span id="status" role="status" aria-live="polite">loading …</span>
    </div>
  </section>

  <main id="gridWrap">
    <ul id="grid"></ul>
    <p id="empty" hidden>nothing here with those filters …</p>
  </main>

  <footer><p>&copy; made by lumi 2026</p></footer>

  <script src="/js/site.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/audioviz.js" defer></script>
  <script src="/js/portfolio.js" defer></script>
</body>
</html>
